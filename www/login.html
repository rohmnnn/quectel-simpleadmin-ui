<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · SimpleAdmin</title>
  <link rel="stylesheet" href="css/app.css?v=20261109-1">
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var theme = saved === "light" || saved === "dark" ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <style>
    body.login { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--tx); padding: 24px; box-sizing: border-box; }
    .login-card { width: 100%; max-width: 380px; background: var(--card); border: var(--card-border); border-radius: var(--r); box-shadow: var(--shadow); padding: 28px; box-sizing: border-box; }
    .login-card h1 { margin: 0 0 6px; font-size: 22px; }
    .login-card p { margin: 0 0 18px; color: var(--tx2); font-size: 14px; line-height: 1.45; }
    .login-card .field { display: block; margin-bottom: 14px; }
    .login-card .field span { display: block; margin-bottom: 6px; font-size: 13px; color: var(--tx2); }
    .login-card input { width: 100%; box-sizing: border-box; }
    .login-card button { width: 100%; margin-top: 4px; }
    .login-brand { font-size: 13px; color: var(--tx3); margin-bottom: 14px; letter-spacing: .02em; }
  </style>
</head>
<body class="login">
  <main class="login-card">
    <div class="login-brand">SimpleAdmin</div>
    <h1 id="login-title">Sign in</h1>
    <p id="login-sub">Checking the device…</p>
    <form id="login-form" style="display:none" novalidate>
      <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" autofocus></label>
      <label class="field" id="login-confirm-field" style="display:none"><span>Repeat the password</span><input id="password-confirm" type="password" autocomplete="new-password"></label>
      <button class="primary" type="submit" id="login-submit">Sign in</button>
    </form>
    <p class="result" id="login-result" role="status" aria-live="polite" style="margin-top:14px"></p>
  </main>
  <script src="js/login.js?v=20261109-1"></script>
</body>
</html>
