<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SMS · SimpleAdmin</title>
  <link rel="stylesheet" href="css/app.css?v=20261111-2">
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var theme = saved === "light" || saved === "dark" ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
</head>
<body data-page="sms">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-col"><div class="page-wrap">
      <div id="status-slot"></div>
      <main class="page" id="page">
        <div class="page-head"><h1>SMS</h1><div class="form-actions"><button class="secondary" type="button" id="sms-refresh">Refresh inbox</button><button class="secondary" type="button" id="sms-prepare">Prepare SMS mode</button></div></div>
        <section class="card">
          <div class="page-head"><h2>Inbox</h2><label class="check-field"><input type="checkbox" id="sms-select-all">Select all</label></div>
          <div class="form-actions"><button type="button" class="danger-button" id="sms-delete-selected">Delete selected</button><button type="button" class="secondary" id="sms-delete-all">Delete all</button></div>
          <p class="result" id="sms-inbox-result" role="status" aria-live="polite"></p>
          <div class="table-wrap">
            <table class="data-table"><thead><tr><th></th><th>Sender</th><th>Received</th><th>Message</th></tr></thead><tbody id="sms-rows"><tr><td colspan="4">Loading messages…</td></tr></tbody></table>
          </div>
        </section>
        <section class="card">
          <h2>Send a message</h2>
          <form id="sms-form" class="form-grid sms-compose">
            <label class="field"><span>Recipient's number</span><input id="sms-number" type="tel" autocomplete="tel" required></label>
            <label class="field"><span>Default country code (optional)</span><input id="sms-country" type="text" inputmode="tel" placeholder="e.g. +62" autocomplete="off"></label>
            <p class="muted field-wide">With a country code set, a number starting with 0 is sent in international format. Leave it empty to send the number exactly as typed. The final number is shown before sending.</p>
            <label class="field"><span>SMS content</span><textarea id="sms-message" rows="4" required></textarea></label>
            <div class="form-actions"><button class="primary" type="submit" id="sms-send">Send SMS</button><span class="muted" id="sms-count"></span></div>
            <p class="result field-wide" id="sms-send-result" role="status" aria-live="polite"></p>
          </form>
        </section>
      </main>
    </div></div>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <script src="js/shell.js?v=20261111-2"></script>
  <script src="js/at.js?v=20261111-2"></script>
  <script src="js/sms.js?v=20261111-2"></script>
</body>
</html>
