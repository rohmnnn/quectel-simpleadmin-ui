<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>More · SimpleAdmin</title>
  <link rel="stylesheet" href="css/app.css?v=20261109-1">
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var theme = saved === "light" || saved === "dark" ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <script src="js/auth.js?v=20261109-1"></script>
</head>
<body data-page="more">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-col">
      <div class="page-wrap">
        <div id="status-slot"></div>
        <main class="page" id="page">
          <div class="more-head"><h1>More</h1></div>
          <div class="more-list">
            <a href="/settings.html">Settings</a>
            <a href="/settings.html#terminal">AT terminal</a>
            <a href="/settings.html#ttl">TTL</a>
            <a href="/deviceinfo.html">Device info</a>
            <a href="/watchcat.html">Watchcat</a>
            <a href="/diagnostics.html">Diagnostics</a>
            <a href="/console">Console</a>
            <a href="#" id="logout-link" style="display:none">Log out</a>
            <button type="button" class="more-row" data-theme-row>
              <span>Dark mode</span>
              <span class="switch" data-theme-switch role="switch" aria-checked="false" aria-label="Dark mode, off"></span>
            </button>
          </div>
          <small class="version">SimpleAdmin Rev-Alpha-0.9 · By iamromulan</small>
          <small class="version">MIT License with Additional Stipulations · See README for terms.</small>
        </main>
      </div>
    </div>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <script src="js/shell.js?v=20261109-1"></script>
  <script>
    if (window.SA_AUTH) SA_AUTH.ready.then(function () {
      if (SA_AUTH.mode !== "session") return;
      var link = document.getElementById("logout-link");
      link.style.display = "";
      link.addEventListener("click", function (e) { e.preventDefault(); SA_AUTH.logout(); });
    });
  </script>
</body>
</html>
